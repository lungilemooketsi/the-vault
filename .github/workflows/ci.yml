name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Card harness
        working-directory: card-code
        run: npm test

      - name: Install Octave
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y octave

      - name: MATLAB logic via Octave
        run: octave --no-gui --quiet --eval "cd('matlab/tests'); run_all"

      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Secret scan
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml --verbose
